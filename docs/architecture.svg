<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="unity-source-explorer architecture">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="860" height="360" fill="#ffffff"/>
  <rect x="30" y="40" width="210" height="80" rx="10" fill="#0f172a"/>
  <text x="135" y="72" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Question</text>
  <text x="135" y="94" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12">"what does Unity actually</text>
  <text x="135" y="110" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12">do when I call X?"</text>

  <rect x="310" y="110" width="250" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="435" y="140" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700">unityref CLI</text>
  <text x="435" y="163" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">use · versions · status</text>
  <text x="435" y="181" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">search · member · outline</text>
  <text x="435" y="199" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">show · tree · setup</text>
  <text x="435" y="228" text-anchor="middle" fill="#64748b" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11">remote: on-demand fetch ·</text>
  <text x="435" y="243" text-anchor="middle" fill="#64748b" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11">local clone: rg fast path</text>

  <rect x="620" y="40" width="215" height="90" rx="10" fill="#ecfdf5" stroke="#238636" stroke-width="1.5"/>
  <text x="727" y="72" text-anchor="middle" fill="#065f46" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Local metadata only</text>
  <text x="727" y="92" text-anchor="middle" fill="#3f7256" font-family="monospace" font-size="12">~/.unitycsref-meta</text>
  <text x="727" y="112" text-anchor="middle" fill="#3f7256" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11">repo address + file tree (~1 MB, no source)</text>

  <rect x="620" y="230" width="215" height="100" rx="10" fill="#0f172a"/>
  <text x="727" y="262" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">GitHub</text>
  <text x="727" y="282" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Unity-Technologies/</text>
  <text x="727" y="298" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">UnityCsReference</text>
  <text x="727" y="318" text-anchor="middle" fill="#64748b" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11">1391 tags · 34 branches</text>

  <rect x="30" y="250" width="210" height="80" rx="10" fill="#ecfdf5" stroke="#238636" stroke-width="1.2"/>
  <text x="135" y="278" text-anchor="middle" fill="#065f46" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">references/</text>
  <text x="135" y="298" text-anchor="middle" fill="#3f7256" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11">repo-map · conventions</text>
  <text x="135" y="314" text-anchor="middle" fill="#3f7256" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11">recipes — verified facts</text>

  <path d="M240 80 H285 V150 H310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M560 165 H585 V100 H620" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M727 130 V230" fill="none" stroke="#238636" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M742 230 V130" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M240 290 H310" fill="none" stroke="#238636" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="290" y="282" text-anchor="middle" fill="#3f7256" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10">guides what to look for</text>
  <text x="585" y="155" text-anchor="middle" fill="#64748b" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10">search · outline · show</text>
  <text x="764" y="184" text-anchor="middle" fill="#3f7256" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10">trees API (1 call/ref)</text>
  <text x="764" y="210" text-anchor="middle" fill="#64748b" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10">raw fetch · nothing stored</text>
</svg>
